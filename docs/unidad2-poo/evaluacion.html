<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Evaluación - POO</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

<header>
    <h1>🧪 Evaluación - Unidad 2</h1>
</header>

<div class="container">

    <h2>Respondé:</h2>

    <p>1. ¿Qué es una clase?</p>
    <input type="text" id="p1">

    <p>2. ¿Qué es un objeto?</p>
    <input type="text" id="p2">

    <p>3. ¿Para qué sirve <code>new</code>?</p>
    <input type="text" id="p3">

    <br><br>

    <button onclick="corregir()" class="btn">Corregir</button>

    <h3 id="resultado"></h3>

    <br>
    <a href="index.html" class="btn">⬅ Volver a la unidad</a>

</div>

<script>
function corregir() {
    let puntaje = 0;

    if (document.getElementById("p1").value.toLowerCase().includes("molde")) {
        puntaje++;
    }

    if (document.getElementById("p2").value.toLowerCase().includes("instancia")) {
        puntaje++;
    }

    if (document.getElementById("p3").value.toLowerCase().includes("crear")) {
        puntaje++;
    }

    document.getElementById("resultado").innerText =
        "Puntaje: " + puntaje + "/3";
}
</script>

</body>
</html>
